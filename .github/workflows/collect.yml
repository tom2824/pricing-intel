# Collecte planifiée (ADR 0004) : un cron GitHub Actions lance l'app en mode batch.
# Pour l'instant les relevés sont conservés comme artefact du workflow ; le sink Postgres/Supabase viendra
# dans une étape suivante et se branchera par configuration, sans toucher à ce workflow.
name: Collecte

on:
  workflow_dispatch:
  # Décommenter pour activer la collecte quotidienne (08:00 UTC, soit 10:00 à Paris en été).
  # schedule:
  #   - cron: '0 8 * * *'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build the batch application
        run: ./mvnw -B --no-transfer-progress -DskipTests -pl app-batch -am package

      - name: Run the collection
        # Les annonces à relever sont dans config/listings.yml (non versionné) : on part de l'exemple
        # tant que le fichier réel n'est pas fourni autrement (secret, artefact, base de données...).
        run: |
          if [ ! -f config/listings.yml ]; then cp config/listings.example.yml config/listings.yml; fi
          java -jar app-batch/target/app-batch-*-exec.jar \
            --collector.sinks.types=console,jsonl \
            --collector.sinks.jsonl-file=data/releves-${{ github.run_id }}.jsonl

      - name: Publish collected snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: releves-${{ github.run_id }}
          path: |
            data/*.jsonl
            data/raw/**
          retention-days: 30
