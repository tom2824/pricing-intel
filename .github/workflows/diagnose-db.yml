# Diagnostic de connexion à la base (workflow_dispatch). N'affiche jamais les valeurs des secrets :
# seulement la longueur du mot de passe, la présence d'espaces ou de fins de ligne, et le résultat de psql.
name: Diagnostic base

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRICING_INTEL_DB_URL: ${{ secrets.PRICING_INTEL_DB_URL }}
      PRICING_INTEL_DB_USER: ${{ secrets.PRICING_INTEL_DB_USER }}
      PGPASSWORD: ${{ secrets.PRICING_INTEL_DB_PASSWORD }}
    steps:
      - name: Inspect secrets shape (values never printed)
        run: |
          echo "password bytes: $(printf '%s' "$PGPASSWORD" | wc -c)"
          echo "password whitespace chars: $(printf '%s' "$PGPASSWORD" | tr -cd '[:space:]' | wc -c)"
      - name: Try psql through the session pooler
        run: |
          host=$(echo "$PRICING_INTEL_DB_URL" | sed -E 's#jdbc:postgresql://([^:/]+).*#\1#')
          echo "host=$host"
          psql "host=$host port=5432 dbname=postgres user=$PRICING_INTEL_DB_USER sslmode=require" -c "select current_user, version();" || echo "PSQL FAILED"
      - name: Data summary (counts, last collection, latest snapshots, recommendations)
        run: |
          host=$(echo "$PRICING_INTEL_DB_URL" | sed -E 's#jdbc:postgresql://([^:/]+).*#\1#')
          conn="host=$host port=5432 dbname=postgres user=$PRICING_INTEL_DB_USER sslmode=require"
          psql "$conn" -c "select (select count(*) from product) products, (select count(*) from listing) listings, (select count(*) from listing_match where status='validated' and valid_to is null) matches, (select count(*) from price_snapshot) snapshots, (select count(*) from collection_run) runs, (select count(*) from collection_failure) failures, (select count(*) from recommendation) recommendations;" || true
          psql "$conn" -c "select id, started_at, attempted, collected, failed from collection_run order by id desc limit 3;" || true
          psql "$conn" -c "select l.code, s.observed_date, s.price, s.availability, s.extraction_method, s.quarantine from price_snapshot s join listing l on l.id = s.listing_id order by s.observed_at desc limit 30;" || true
          psql "$conn" -c "select listing_code, reason from collection_failure order by id desc limit 15;" || true
          psql "$conn" -c "select p.name, r.scope, r.strategy, r.fell_back, r.price, r.index_vs_median, r.market->>'sourceCount' as sources, r.market->>'min' as min, r.market->>'median' as median from recommendation_latest r join product p on p.id = r.product_id order by p.family_code, p.name, r.scope;" || true
          psql "$conn" -c "select p.name, r.explanation->>'text' as explanation from recommendation_latest r join product p on p.id = r.product_id where r.scope = 'strict' order by p.name limit 6;" || true
