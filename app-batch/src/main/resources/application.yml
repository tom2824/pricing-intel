spring:
  main:
    web-application-type: none
    banner-mode: "off"
  application:
    name: pricing-intel-batch
  # Sans base de données (profil par défaut), l'auto-configuration JDBC/JPA/Flyway est désactivée :
  # l'application tourne en mode fichiers. Le profil "postgres" la réactive (voir application-postgres.yml).
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.JdbcClientAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.sql.init.SqlInitializationAutoConfiguration

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %-40.40logger{39} : %msg%n"
  level:
    root: warn
    io.github.tom2824.pricingintel: info

# Toutes les clés sont surchargeables : --collector.sinks.types=jsonl, COLLECTOR_PROXY_MODE=fixed, etc.
collector:
  user-agent: "pricing-intel/0.1 (+https://github.com/tom2824/pricing-intel)"
  timeout: 20s
  respect-robots-txt: true
  min-interval-per-host: 3s
  default-currency: EUR
  proxy:
    mode: none          # none | fixed | rotating
    # host: proxy.example.test
    # port: 3128
    # servers: [p1.example.test:8080, p2.example.test:8080]
  retry:
    max-attempts: 3
    initial-backoff: 2s
    multiplier: 2.0
    max-backoff: 30s
  sites:
    dir: config/sites
    allow-unknown-hosts: true
  listings:
    source: yaml            # yaml | database (profil postgres)
    file: config/listings.yml
  sinks:
    types: [console, jsonl]   # console | jsonl | postgres (profil postgres), cumulables
    jsonl-file: data/releves.jsonl
  raw:
    enabled: true
    dir: data/raw
    distilled:               # blocs JSON + Markdown du contenu visible : léger, archive de long terme (ADR 0014)
      enabled: true
      retention: 180d        # 0 = jamais purgé
    html:                    # HTML complet : lourd, pour déboguer un extracteur qui casse
      enabled: false
      retention: 7d
  catalogue:
    # import-file: config/catalogue.yml   # profil postgres : importe produits, identifiants et annonces avant la collecte
    collect-after-import: true

# Profils de prix (ADR 0022, 0005) et règles du marché (ADR 0020). Calculés après chaque collecte sous le profil
# postgres : une recommandation par produit, par périmètre (strict, segment) et par profil, avec son explication.
pricing:
  enabled: true
  # ADR 0023 : après les recommandations, une règle tirée au sort (uniforme, graine = jour + produit) devient
  # notre prix du jour. Le prix du catalogue n'est qu'un prix initial.
  daily-decision: true
  # Le premier profil est la référence des vues de synthèse. Formats : index:98, index:100:mean, align,
  # undercut:1, cost-plus:25, leader:ldlc:-2, hold. Les garde-fous ci-dessous sont communs à tous.
  profiles: [index:98, index:95, index:100, index:103, align, undercut:1, cost-plus:25]
  min-sources: 2
  margin-floor-percent: 15
  ceiling-percent-of-median: 110
  max-daily-move-percent: 5
  rounding-cents: 99
  freshness: 48h
  in-stock-only: true
  include-refurbished: false
  exclude-quarantined: true
  exclude-marketplace: true
