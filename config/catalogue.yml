# Catalogue de démonstration (ADR 0015, 0016), importé à chaque collecte sous le profil postgres :
#   java -jar app-batch/target/app-batch-*-exec.jar --collector.catalogue.import-file=config/catalogue.yml
# L'import est idempotent : un produit est reconnu par sa clé naturelle, une annonce par son code.
# Ce fichier est public : il ne contient que des références produit et des URL de fiches.
#
# Trois segments, trois marques par segment, relevés sur LDLC, TopAchat et Materiel.net (septembre 2026).
# GTIN et références fabricant relevés dans le JSON-LD des fiches LDLC. Les prix d'achat sont fictifs.

