# Catalogue de démonstration (ADR 0015, 0016, 0019), importé à chaque collecte sous le profil postgres :
#   java -jar app-batch/target/app-batch-*-exec.jar --collector.catalogue.import-file=config/catalogue.yml
# L'import est idempotent : un produit est reconnu par sa clé naturelle, une annonce par son code.
# Ce fichier est public : il ne contient que des références produit et des URL de fiches.
#
# Cinq segments, relevés sur LDLC, TopAchat, Materiel.net et Cybertek (septembre 2026).
# Un produit qu'aucune enseigne ne vend plus passe en « status: retired » et ses annonces en « active: false » :
# il sort des vues et du moteur, son historique reste en base.
# GTIN et références fabricant relevés dans le JSON-LD des fiches. Les prix d'achat sont fictifs.
# currentPrice est un prix initial : dès le premier passage, notre prix vit en base et change chaque jour
# selon une règle tirée au sort (ADR 0023). Modifier cette valeur ne change pas un produit déjà créé.

