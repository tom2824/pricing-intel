# Cybertek (groupe indépendant de LDLC/Materiel.net, ADR 0019). La plupart des fiches ont un JSON-LD Product
# avec gtin13 et mpn ; certaines fiches ont un JSON-LD malformé, d'où le repli CSS, vérifié sur de vraies fiches
# (septembre 2026) : prix au format "894€99" dans span#_ctl0_ContentPlaceHolder1_l_prix (le premier
# span.fiche_product_price du document est le prix barré, souvent vide), disponibilité dans .prodfiche_dispo.
id: cybertek
host: "*.cybertek.fr"
extractors:
  - type: jsonld
  - type: css
    price: "#_ctl0_ContentPlaceHolder1_l_prix, .fiche-produit__bloc-achat__prix__affichageprix .fiche_product_price, span.fiche_product_price"
    listPrice: "#_ctl0_ContentPlaceHolder1_l_prix_barre_euros"
    availability: "div.prodfiche_dispo"
    inStock: ["en stock", "en livraison", "dispo"]
    outOfStock: ["pas de stock", "rupture", "indisponible", "épuisé"]
    title: "h1"
